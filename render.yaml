services:
  - type: web
    name: english-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Europe/Kyiv
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
